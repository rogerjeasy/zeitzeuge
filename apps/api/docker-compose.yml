# Local dependencies: Postgres with pgvector (the Aurora stand-in) and moto
# (the AWS stand-in). Not a deployment artefact — production is ECS Fargate,
# Aurora Serverless v2 and real Cognito. This exists so the API can be run and
# tested on a laptop, on a train, with no AWS account attached.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zeitzeuge
      POSTGRES_PASSWORD: zeitzeuge
      POSTGRES_DB: zeitzeuge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeitzeuge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - zeitzeuge-db:/var/lib/postgresql/data
      # Creates the non-superuser application role. See the file for why that
      # distinction is the whole point.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  aws:
    # Cognito, S3 and DynamoDB, speaking the real APIs. The application code
    # is identical against this and against AWS — only ZZ_AWS_ENDPOINT_URL
    # differs, and it is empty everywhere but here.
    image: motoserver/moto:5.0.16
    ports: ["5001:5000"]
    environment:
      MOTO_PORT: 5000

volumes:
  zeitzeuge-db:
