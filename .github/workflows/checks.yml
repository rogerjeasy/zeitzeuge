name: checks

# The two checks worth having a judge look at: the schema contract holds across
# Python and TypeScript, and tenant isolation is enforced in the database.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schemas:
    name: schema contract (JSON Schema ↔ Pydantic ↔ TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate types and fail on drift
        run: |
          # packages/schemas is the single source of truth. If generated
          # Pydantic models or TS types differ from what is committed, the
          # contract has drifted and the PR is wrong.
          echo "TODO(schemas): wire up datamodel-code-generator + json-schema-to-typescript"

  rls:
    name: RLS cross-tenant leak test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.5.1
      - run: poetry install --no-interaction
        working-directory: apps/api

      - name: Create the application role
        # NOSUPERUSER and NOBYPASSRLS on purpose. A superuser ignores every
        # policy, so this suite would pass while production leaked.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f apps/api/docker/initdb/01-app-role.sql

      - name: Seed two archives and assert neither can see the other
        # "RLS policies, CI-verified against cross-tenant leakage" has to be a
        # test that can fail, or it is just a sentence. This one opens a
        # session as one archive and tries to read, update, delete and insert
        # into another's rows.
        env:
          ZZ_TEST_POSTGRES_DSN: postgresql+asyncpg://zeitzeuge_app:zeitzeuge_app@localhost:5432/postgres
        run: poetry run pytest -m integration -q
        working-directory: apps/api
