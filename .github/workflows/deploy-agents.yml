name: deploy-agents

on:
  push:
    branches: [main]
    paths: ["services/agents/**", "services/falsifier/**", "services/mcp-geo/**", "packages/schemas/**"]

defaults:
  run:
    # Explicit, so GitHub runs `bash -eo pipefail`: the implicit default has no
    # pipefail, and `cmd | tee` would then pass even when `cmd` fails.
    shell: bash

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-2
  ECR_REPO: zeitzeuge/agents

jobs:
  deploy:
    # Same gate as deploy-api/deploy-web. `services/agents` does not exist in
    # this repository yet, so this workflow has nothing to build until it does.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3   # arm64 images on an x86 runner
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the agent image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPO:latest" \
            --push services/agents

      - name: Point every agent function at the new image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for fn in $(aws lambda list-functions \
                --query 'Functions[?starts_with(FunctionName, `zeitzeuge-prod-agent-`)].FunctionName' \
                --output text); do
            echo "updating $fn"
            aws lambda update-function-code \
              --function-name "$fn" \
              --image-uri "$REGISTRY/$ECR_REPO:${{ github.sha }}" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$fn"
          done
      # The state machine definition is rendered and applied by Terraform
      # (orchestration module), never pushed from here.
