name: deploy-api

# tests → image → migrate → seed → roll → smoke, against the real account.
#
# Nothing here is simulated: the image runs on ECS Fargate in eu-central-2,
# migrations run inside the VPC against Aurora, the seed writes the demo
# tenant to Aurora and the guest identity to Cognito, and the smoke test goes
# through CloudFront like a browser. Infrastructure itself is never changed
# from CI — the deploy role cannot (infra/modules/cicd).
#
# Until `make github` has run (after `make apply`), DEPLOY_ENABLED is unset:
# the tests still gate every push, and the deploy jobs show as skipped rather
# than failing on credentials that do not exist yet.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/ci-api.yml"
      - ".github/actions/build-push/**"
      - ".github/scripts/**"
  workflow_dispatch: # also: roll out a Terraform change to a task definition

# One production rollout at a time, and never cancel one halfway through a
# migration.
concurrency:
  group: deploy-api
  cancel-in-progress: false

defaults:
  run:
    # Explicit, so GitHub runs `bash -eo pipefail`: the implicit default has no
    # pipefail, and `cmd | tee` would then pass even when `cmd` fails.
    shell: bash

permissions:
  contents: read

env:
  AWS_REGION: eu-central-2
  ECR_REPO: zeitzeuge/api
  ECS_CLUSTER: zeitzeuge-prod
  ECS_SERVICE: zeitzeuge-prod-api
  FAMILY_API: zeitzeuge-prod-api
  FAMILY_MIGRATE: zeitzeuge-prod-api-migrate
  FAMILY_SEED: zeitzeuge-prod-api-seed

jobs:
  ci:
    uses: ./.github/workflows/ci-api.yml

  build:
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04 # Fargate runs the API on X86_64
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy configuration is present
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::DEPLOY_ENABLED is set but AWS_DEPLOY_ROLE_ARN is not. Run 'make github' in infra/."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: push
        uses: ./.github/actions/build-push
        with:
          context: apps/api
          repository: ${{ env.ECR_REPO }}
          platform: linux/amd64

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      NETWORK: ${{ vars.ECS_MIGRATE_NETWORK_CONFIG }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy configuration is present
        run: |
          for name in NETWORK APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable for $name is missing. Run 'make github' in infra/."
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pin a revision of each family to this commit's image
        id: pin
        # Assigned before being written: `echo "x=$(cmd)"` succeeds even when
        # `cmd` fails, which once let an AccessDenied through as an empty ARN.
        run: |
          api=$(.github/scripts/ecs-pin-revision.sh "$FAMILY_API" "$IMAGE")
          migrate=$(.github/scripts/ecs-pin-revision.sh "$FAMILY_MIGRATE" "$IMAGE")
          seed=$(.github/scripts/ecs-pin-revision.sh "$FAMILY_SEED" "$IMAGE")
          printf 'api=%s\nmigrate=%s\nseed=%s\n' "$api" "$migrate" "$seed" >> "$GITHUB_OUTPUT"

      # Before the roll, so the new code never meets the old schema. Migrations
      # must therefore be additive (expand, then contract in a later release):
      # the old tasks keep serving on the new schema until the roll completes.
      - name: Migrate Aurora — the service is not rolled unless this exits 0
        env:
          TASK_DEFINITION: ${{ steps.pin.outputs.migrate }}
        run: .github/scripts/ecs-run-task.sh "$ECS_CLUSTER" "$TASK_DEFINITION" "$NETWORK"

      # Idempotent. On every deploy, so "Als Gast demo starten" can never
      # silently stop working: the demo tenant in Aurora, the guest user in
      # Cognito with the password held in Secrets Manager.
      - name: Seed the demo tenant and guest identity
        env:
          TASK_DEFINITION: ${{ steps.pin.outputs.seed }}
        run: .github/scripts/ecs-run-task.sh "$ECS_CLUSTER" "$TASK_DEFINITION" "$NETWORK"

      - name: Roll the service — and fail on a circuit-breaker rollback
        id: roll
        env:
          TASK_DEFINITION: ${{ steps.pin.outputs.api }}
        run: .github/scripts/ecs-deploy-service.sh "$ECS_CLUSTER" "$ECS_SERVICE" "$TASK_DEFINITION" | tee -a "$GITHUB_OUTPUT"

      - name: Smoke test through CloudFront
        if: steps.roll.outputs.running != '0'
        run: .github/scripts/smoke.sh api "$APP_URL"
      - name: Nothing to smoke-test yet
        if: steps.roll.outputs.running == '0'
        run: echo "::warning::$ECS_SERVICE has 0 tasks — set api_image_ready = true in infra/envs/prod/terraform.tfvars and 'make apply'. The image and migrations are in place."

      - name: Summary
        if: always()
        env:
          REVISION: ${{ steps.pin.outputs.api }}
          RUNNING: ${{ steps.roll.outputs.running }}
        run: |
          {
            echo "### deploy-api"
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`$IMAGE\` |"
            echo "| revision | \`${REVISION:-not registered}\` |"
            echo "| tasks | ${RUNNING:-n/a} |"
            echo "| app | $APP_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
